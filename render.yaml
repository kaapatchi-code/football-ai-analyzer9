services:
  - type: web
    name: football-ai-analyzer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/status
    envVars:
      - key: HIGHLIGHTLY_API_KEY
        sync: false
      - key: HIGHLIGHTLY_BASE_URL
        value: https://soccer.highlightly.net
      - key: API_DAILY_SOFT_LIMIT
        value: "85"
      - key: CORS_ORIGINS
        value: "*"
